{% extends 'base.html' %}
{% load crispy_forms_tags %}


{% block title %}
    <title>DELETE EMPLOYEE</title>
{% endblock %}

{% block content %}
    <div class="container bg-info" style="padding: 20px;">
        <h1 style="text-align: center;">Delete Employee Profile</h1>
        <form method="post">
            {% csrf_token %}
            <h1 style="text-align: center;">{{form.eid}} {{form.first_name}} {{form.last_name}}</h1>
            <button type="submit" class="btn btn-dark col-5 me-3">DELETE EMPLOYEE</button>
            <a href="{% url 'show_emp' %}"><button type="button" class="btn btn-dark col-5 me-3 float-end">CANCEL EMPLOYEE</button></a>
        </form>
    </div>
{% endblock %}
