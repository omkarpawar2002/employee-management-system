{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}
    <title>CREATE EMPLOYEE</title>
{% endblock %}

{% block content %}
    <div class="container bg-info" style="padding: 20px;">
        <h1 style="text-align: center;">Create Employee Profile</h1>
        <form method="POST">
            {% csrf_token %}
            <table>
                {{form|crispy}}
            </table>
            <button type="submit" class="btn btn-dark col-5 me-3">ADD EMPLOYEE</button>
            <button type="reset" class="btn btn-dark col-5 me-3 float-end">RESET EMPLOYEE</button>
        </form>
    </div>
{% endblock %}
