{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}
<title>USER SIGN UP / REGISTER</title>
{% endblock %}

{% block content %}
<div class="container bg-info" style="padding: 20px;">
    <h1 style="text-align: center;">USER SIGN UP / REGISTER</h1>
    <form method="post">
        {% csrf_token %}
        {{form | crispy}}
        <button type="submit" class="btn btn-dark col-5 me-3">REGISTER</button>
        <a href="{% url 'sign_in' %}"><button type="button" class="btn btn-dark col-5 me-3 float-end">LOG
                IN</button></a>
    </form>
</div>
{% endblock %}
